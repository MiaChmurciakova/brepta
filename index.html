<meta name="theme-color" content="#161330" media="(prefers-color-scheme: dark)">

<title>Brepta</title>

<style>
:root{
  --ground:#F1EFFB; --surface:#FFFFFF; --surface-2:#F6F4FD;
  --ink:#211D3B; --ink-2:#5C5480; --muted:#6B6490; --line:#DDD7F3;
  --accent:#7C5CFC; --accent-ink:#FFFFFF; --accent-soft:#EEE9FE;
  --teal:#3B6FE4; --teal-soft:#E7EDFE;
  --good:#226B3D; --good-soft:#DCEFE2;
  --shadow:0 1px 0 rgba(33,29,59,.06), 0 12px 28px -16px rgba(33,29,59,.45);
  --r:16px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#161330; --surface:#211C3D; --surface-2:#2A2451;
    --ink:#EDEAFB; --ink-2:#C2B9E9; --muted:#8F87B9; --line:#39305D;
    --accent:#A78BFA; --accent-ink:#1E1533; --accent-soft:#332958;
    --teal:#7FA6FF; --teal-soft:#1E2C52;
    --good:#7BE3A8; --good-soft:#1F4934;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#161330; --surface:#211C3D; --surface-2:#2A2451;
  --ink:#EDEAFB; --ink-2:#C2B9E9; --muted:#8F87B9; --line:#39305D;
  --accent:#A78BFA; --accent-ink:#1E1533; --accent-soft:#332958;
  --teal:#7FA6FF; --teal-soft:#1E2C52;
  --good:#7BE3A8; --good-soft:#1F4934;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}

.shell{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:0 16px calc(84px + env(safe-area-inset-bottom));}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 2px 10px;}
.brand{display:flex;align-items:center;gap:9px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:21px}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:18px;transform:rotate(-4deg)}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.today{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.today .lvl{font-family:"Baloo 2",sans-serif;font-size:26px;font-weight:600;line-height:1.15}
.today p{margin:0;color:var(--ink-2);font-size:15.5px}
.cta{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);
  padding:16px;font-family:"Baloo 2",sans-serif;font-size:21px;font-weight:600;width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease}
.cta:active{transform:translateY(2px)}
.cta.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.levels{display:flex;flex-direction:column;gap:9px;list-style:none;padding:0;margin:0}
.level{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.level .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--surface-2);
  display:grid;place-items:center;font-size:21px}
.level .nm{font-weight:700;font-size:16px;line-height:1.25}
.level .sub{font-size:13.5px;color:var(--muted)}
.level.now{border-color:var(--accent);background:var(--accent-soft)}
.level.now .ic{background:var(--accent);color:var(--accent-ink)}
.level.done .ic{background:var(--good-soft);color:var(--good)}
.level.locked{opacity:.55}
.level .rightnote{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 20px;border-radius:14px;
  font-size:12px;font-weight:700;color:var(--muted)}
.nav button .ic{font-size:21px;line-height:1}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.practice{position:fixed;inset:0;background:var(--ground);z-index:40;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.p-top{display:flex;align-items:center;gap:12px;max-width:540px;width:100%;margin:0 auto}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dot{height:6px;flex:1 1 10px;border-radius:99px;background:var(--line)}
.dot.on{background:var(--accent)}
.close{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:19px;flex:0 0 38px}
.backline{display:flex;gap:9px;justify-content:center;margin-top:10px}
.backline button{background:none;color:var(--muted);font-weight:700;font-size:15px;padding:8px 12px;border-radius:12px}
.p-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;
  max-width:540px;width:100%;margin:0 auto;padding:18px 0}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px 20px;
  box-shadow:var(--shadow);text-align:center;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.p-kind{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.p-emoji{font-size:56px;line-height:1;margin:10px 0 4px}
.p-word{font-family:"Baloo 2",sans-serif;font-weight:600;font-size:clamp(38px,11vw,58px);line-height:1.1;
  margin:6px 0;letter-spacing:-.02em}
.p-word.small{font-size:clamp(25px,6.6vw,34px);line-height:1.28}
.hl{color:var(--accent)}
.p-how{color:var(--ink-2);font-size:16px;margin:10px auto 0;max-width:34ch}
.p-reps{display:inline-block;margin-top:12px;background:var(--teal-soft);color:var(--teal);
  border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px}
.tools{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tool{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;
  font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.rate{display:flex;flex-direction:column;gap:9px;max-width:540px;width:100%;margin:0 auto}
.rate button{flex:1;border-radius:var(--r);padding:15px 8px;font-weight:800;font-size:16px;
  border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px}
.rate .yes{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.rate .again{background:var(--surface-2);color:var(--ink-2)}
.rate .em{font-size:22px}

.done-wrap{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done-stars{font-size:52px;letter-spacing:4px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font-family:"Baloo 2",sans-serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
.week{display:flex;gap:6px;margin-top:12px}
.day{flex:1;aspect-ratio:1;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.prose p{color:var(--ink-2);font-size:15.5px;margin:9px 0}
.prose ol{color:var(--ink-2);font-size:15.5px;padding-left:20px;margin:9px 0}
.prose li{margin:5px 0}
.note{background:var(--teal-soft);border-radius:var(--r);padding:14px;font-size:15px;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.field label{font-weight:800;font-size:14px}
select{width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);font:inherit;font-weight:700}
.danger{color:var(--accent);font-weight:800;font-size:15px;text-decoration:underline;padding:4px 0}
.level-about{margin:2px 4px 8px;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.level-about p{margin:0}
.level-about .mini{margin-top:6px;color:var(--muted);font-weight:700;font-size:13.5px}
.switch{margin-top:10px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:12px;
  padding:11px;font-weight:800;font-size:15px}
.soft-note{margin:12px auto 0;max-width:34ch;font-size:14px;color:var(--muted);font-weight:600;line-height:1.5}
.linkish{color:var(--accent);font-weight:800;text-decoration:underline;padding:2px 0}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px}
.confirm.ok{border-color:var(--good);background:var(--good-soft)}
.confirm-q{margin:0;font-weight:800;font-size:16px}
.confirm-d{margin:6px 0 0;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.confirm-row{display:flex;gap:9px;margin-top:12px}
.confirm-row button{flex:1;border-radius:12px;padding:12px 8px;font-weight:800;font-size:15px;border:1px solid var(--line)}
.btn-danger{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-quiet{background:var(--surface);color:var(--ink)}
.verze{margin:16px 0 0;font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<!-- ARTIFACT:HEAD-END -->
</head>

<div class="practice hidden" id="practice"></div>

<script>
/* ----------------------------- stav ----------------------------- */
const VERZE = "22 · 3. 9. 2026";
const KEY = "brepta.v1";
const OLD_KEY = "motorka.v1";   // appka se drive jmenovala Motorka
const DEFAULT_STATE = { level:1, stars:0, days:[], offset:{}, doneCount:{}, doneOn:{} };
let S = load();

function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(!raw){
      // prenos postupu z doby, kdy se appka jmenovala Motorka
      const old = localStorage.getItem(OLD_KEY);
      if(old){ localStorage.setItem(KEY, old); localStorage.removeItem(OLD_KEY); raw = old; }
    }
    if(raw) return Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
const today = () => new Date().toISOString().slice(0,10);
function dayShift(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function streak(){
  let n=0, i = S.days.includes(today()) ? 0 : -1;
  if(i===-1 && !S.days.includes(dayShift(-1))) return 0;
  while(S.days.includes(dayShift(i))){ n++; i--; }
  return n;
}
const level = id => LEVELS.find(l => l.id===id);

/* ---------------------------- pomůcky --------------------------- */
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function hl(text){
  return esc(text).replace(/[rřRŘ]/g, m => '<span class="hl">'+m+'</span>');
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------------------------- namluvení -------------------------- */
let csVoice = null;
function findVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  csVoice = vs.find(v => /^cs/i.test(v.lang)) || null;
  document.querySelectorAll("[data-speak]").forEach(b => b.classList.toggle("hidden", !csVoice));
}
if("speechSynthesis" in window){
  findVoice();
  speechSynthesis.onvoiceschanged = findVoice;
}
function speak(text){
  if(!csVoice) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = csVoice; u.lang = csVoice.lang; u.rate = 0.75;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------------------- obrazovky -------------------------- */
let tab = "home";
let resetState = "";   // "" | "ask" | "done"
const view = document.getElementById("view");

function render(){
  document.getElementById("streakN").textContent = streak();
  document.querySelectorAll("#nav button").forEach(b =>
    b.dataset.tab === tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  view.innerHTML = tab === "home" ? viewHome() : tab === "stars" ? viewStars() : viewParent();
  findVoice();
}

function viewHome(){
  const L = level(S.level);
  const doneToday = S.doneOn[S.level] === today();
  return `
  <section class="card today">
    <div>
      <div class="eyebrow">Dnešní lekce · asi 5 minut</div>
      <div class="lvl">${L.icon} ${esc(L.name)}</div>
    </div>
    <p>${doneToday
      ? "Dneska už máte hotovo. Další kolo si dát můžete, ale nemusíte."
      : (S.level===1
          ? "Šest cviků na jazyk a rty. Vy předvádíte, dítě opakuje."
          : "Krátká rozcvička jazyka a pak " + esc(L.sub) + ".")}</p>
    <button class="cta ${doneToday ? "ghost" : ""}" id="startBtn">${doneToday ? "🔁 Ještě jednou" : "🏁 Začít lekci"}</button>
  </section>

  <div class="sec-title"><h2>Úrovně</h2><span class="eyebrow">${S.level} z ${LEVELS.length}</span></div>
  <ul class="levels">
    ${LEVELS.map(l => {
      const practiced = (S.doneCount[l.id]||0) > 0;
      let cls, note;
      if(l.id === S.level){ cls = "now"; note = ""; }
      else if(practiced){ cls = "done"; note = "hotovo"; }
      else if(l.id > S.level){ cls = "locked"; note = "později"; }
      else { cls = "locked"; note = "vynecháno"; }
      return `<li><button class="level ${cls}" data-level="${l.id}">
        <span class="ic">${l.icon}</span>
        <span><span class="nm">${esc(l.name)}</span><br><span class="sub">${esc(l.sub)}</span></span>
        <span class="rightnote">${note ? note + " " : ""}▾</span>
      </button>
      <div class="level-about hidden">
        <p>${esc(l.about)}</p>
        ${l.id === S.level
          ? `<p class="mini">Tady teď trénujete.</p>`
          : `<button class="switch" data-switch="${l.id}">${l.id > S.level ? "Přepnout na " + l.id + ". úroveň" : "Vrátit se na " + l.id + ". úroveň"}</button>`}
      </div></li>`;
    }).join("")}
  </ul>
  <p class="prose" style="margin-top:14px;font-size:14px;color:var(--muted)">Tapnutím na kteroukoliv úroveň se vám zobrazí info, co je jejím obsahem. Spustíte ji tlačítkem "Začít lekci" v horní části aplikace.</p>`;
}

function viewStars(){
  const days = [...Array(7)].map((_,i) => dayShift(i-6));
  const names = ["Ne","Po","Út","St","Čt","Pá","So"];
  return `
  <div class="sec-title"><h2>Odměny</h2></div>
  <div class="stat-grid">
    <div class="stat"><div class="n">${S.stars}</div><div class="l">hvězdiček</div></div>
    <div class="stat"><div class="n">${streak()}</div><div class="l">${streak() === 1 ? "den" : (streak() >= 2 && streak() <= 4 ? "dny" : "dní")} v řadě</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="eyebrow">Poslední týden</div>
    <div class="week">
      ${days.map(d => `<div class="day ${S.days.includes(d) ? "on" : ""}">${names[new Date(d).getDay()]}</div>`).join("")}
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="eyebrow">Zvládnuté úrovně</div>
    <ul class="levels" style="margin-top:10px">
      ${LEVELS.filter(l => l.id === S.level || (S.doneCount[l.id]||0) > 0).map(l => `
        <li><div class="level static ${l.id === S.level ? "now" : "done"}">
          <span class="ic">${l.icon}</span>
          <span><span class="nm">${esc(l.name)}</span><br><span class="sub">${S.doneCount[l.id]||0} splněných kartiček</span></span>
        </div></li>`).join("")}
    </ul>
  </div>`;
}

function viewParent(){
  return `
  <div class="sec-title"><h2>Pro rodiče</h2></div>
  <div class="card prose">
    <div class="eyebrow">Jak s tím pracovat</div>
    <ol>
      <li>Krátce a často. Pět minut denně udělá víc než půl hodiny jednou za týden.</li>
      <li>Vy předříkáváte, dítě opakuje. Ať vidí na vaši pusu.</li>
      <li>Nikdy neopravujte slovem „špatně“. Stačí to znovu předvést a jet dál.</li>
      <li>Do další úrovně se jde, až předchozí jde snadno — ne když se zadaří jednou.</li>
      <li>Když se R nedaří rozjet, vraťte se o úroveň níž. Není to krok zpátky.</li>
    </ol>
    <div class="note">Appka nenahrazuje logopeda. Slouží na domácí procvičování mezi návštěvami — a úroveň nastavujte podle toho, kde vás logoped zrovna má.</div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="eyebrow">Nastavení</div>
    <div class="field">
      <label for="lvlSel">Aktuální úroveň</label>
      <select id="lvlSel">
        ${LEVELS.map(l => `<option value="${l.id}" ${l.id===S.level?"selected":""}>${l.id}. ${esc(l.name)}</option>`).join("")}
      </select>
      <p style="font-size:14px;color:var(--muted);margin:4px 0 0">${esc(level(S.level).about)}</p>
    </div>
    <div class="field">
      <label>Začít znovu</label>
      ${resetState === "ask" ? `
        <div class="confirm">
          <p class="confirm-q">Opravdu vymazat postup?</p>
          <p class="confirm-d">Přijdete o ${S.stars} ${S.stars === 1 ? "hvězdičku" : (S.stars >= 2 && S.stars <= 4 ? "hvězdičky" : "hvězdiček")}, o sérii dní i o nastavenou úroveň — appka se vrátí na 1. úroveň. Vzít zpátky to nejde.</p>
          <div class="confirm-row">
            <button class="btn-danger" id="resetYes">Ano, vymazat</button>
            <button class="btn-quiet" id="resetNo">Zrušit</button>
          </div>
        </div>`
      : resetState === "done" ? `
        <div class="confirm ok">
          <p class="confirm-q">✅ Hotovo, postup je vymazaný.</p>
          <p class="confirm-d">Hvězdičky i série dní jsou na nule a appka je zpátky na 1. patře.</p>
          <div class="confirm-row"><button class="btn-quiet" id="resetOk">Rozumím</button></div>
        </div>`
      : `<button class="danger" id="resetBtn">Vymazat postup a hvězdičky</button>`}
    </div>
    <p class="verze">Verze ${VERZE}</p>
  </div>`;
}

/* ---------------------------- lekce ----------------------------- */
let session = null;
const P = document.getElementById("practice");

function buildSession(){
  const L = level(S.level);
  const warm = shuffle(LEVELS[0].items).slice(0,3).map(i => ({...i, kind:"cvik", warm:true}));
  const off = S.offset[L.id] || 0;
  const pool = L.items;
  const take = Math.min(6, pool.length);
  const main = [];
  for(let k=0;k<take;k++) main.push({...pool[(off+k) % pool.length], kind: pool[(off+k)%pool.length].kind || L.kind, speak: !!L.speak});
  S.offset[L.id] = (off + take) % pool.length;
  return S.level === 1
    ? shuffle(LEVELS[0].items).slice(0,6).map(i => ({...i, kind:"cvik"}))
    : warm.concat(main);
}

function startSession(){
  session = { items: buildSession(), i: 0, stars: 0, ratings: [], tries: {}, addedDay: false, addedDone: false, committed: false };
  P.classList.remove("hidden");
  document.getElementById("nav").classList.add("hidden");
  drawCard();
}
function endSession(){
  // Predcasne ukonceni: co uz dite stihlo, se mu pocita.
  if(session && !session.committed && session.i > 0) commit();
  P.classList.add("hidden");
  document.getElementById("nav").classList.remove("hidden");
  session = null;
  render();
}

const KINDNAME = { cvik:"Rozcvička", zvuk:"Zvuk", slovo:"Slovo", veta:"Věta" };

function drawCard(){
  findVoice();
  const it = session.items[session.i];
  const total = session.items.length;
  const isText = it.kind === "slovo" || it.kind === "veta";
  const tries = session.tries[session.i] || 1;
  const long = it.t.length > 12;
  P.innerHTML = `
    <div class="p-top">
      <button class="close" id="backBtn" aria-label="${session.i===0 ? "Zpět na trénink" : "Předchozí kartička"}">←</button>
      <div class="dots">${[...Array(total)].map((_,k)=>`<span class="dot ${k<=session.i?"on":""}"></span>`).join("")}</div>
      <button class="close" id="closeBtn" aria-label="Ukončit lekci">✕</button>
    </div>
    <div class="p-body">
      <div class="p-card">
        <div class="p-kind">${KINDNAME[it.kind] || "Cvičení"}${it.warm ? " · zahřátí" : ""}${tries > 1 ? " · " + tries + ". pokus" : ""}</div>
        <div class="p-emoji">${it.e || "🔤"}</div>
        <div class="p-word ${long ? "small" : ""}">${isText ? hl(it.t) : esc(it.t)}</div>
        ${it.how ? `<p class="p-how">${esc(it.how)}</p>` : ""}
        ${it.note ? `<p class="p-how" style="color:var(--teal);font-weight:700">${esc(it.note)}</p>` : ""}
        ${it.reps ? `<div class="p-reps">${esc(it.reps)}</div>` : ""}
        ${(it.speak && isText && csVoice) ? `<div class="tools"><button class="tool" id="speakBtn">🔊 Poslech</button></div>` : ""}
        ${tries >= 3 ? `<p class="soft-note">Když to dneska nejde, klidně jděte dál — zítra to půjde líp. <button class="linkish" id="skipBtn">Přeskočit kartičku</button></p>` : ""}
      </div>
    </div>
    <div class="rate">
      <button class="yes" data-rate="2"><span class="em">🌟</span>Povedlo se</button>
      <button class="again" data-rate="0"><span class="em">🔁</span>Ještě zkusíme</button>
    </div>`;
}

function advance(){
  session.i++;
  if(session.i >= session.items.length) finishSession();
  else drawCard();
}

function rate(val){
  if(val === 0){
    // Zustavame na stejne karticce a zkousime ji znovu.
    session.tries[session.i] = (session.tries[session.i] || 1) + 1;
    drawCard();
    return;
  }
  session.ratings[session.i] = val;
  if(val === 2) session.stars++;
  advance();
}

/* Krok zpátky: vrátí kartičku i to, co se za ni připsalo. */
function back(){
  if(!session) return;
  if(session.committed) uncommit();
  if(session.i === 0) return endSession();
  session.i--;
  const val = session.ratings[session.i];
  if(val === 2) session.stars = Math.max(0, session.stars - 1);
  session.ratings[session.i] = undefined;
  drawCard();
}

function commit(){
  S.stars += session.stars;
  S.doneCount[S.level] = (S.doneCount[S.level]||0) + session.stars;
  const t = today();
  if(!S.days.includes(t)){ S.days.push(t); session.addedDay = true; }
  if(S.doneOn[S.level] !== t){ S.doneOn[S.level] = t; session.addedDone = true; }
  if(S.days.length > 400) S.days = S.days.slice(-400);
  session.committed = true;
  save();
}
function uncommit(){
  S.stars = Math.max(0, S.stars - session.stars);
  S.doneCount[S.level] = Math.max(0, (S.doneCount[S.level]||0) - session.stars);
  if(session.addedDay){
    S.days = S.days.filter(d => d !== today());
    session.addedDay = false;
  }
  if(session.addedDone){
    delete S.doneOn[S.level];
    session.addedDone = false;
  }
  session.committed = false;
  save();
}

function finishSession(){
  commit();
  const s = Math.max(1, Math.min(3, Math.round(session.stars / Math.max(1, session.items.length) * 3)));
  P.innerHTML = `
    <div class="p-body">
      <div class="p-card done-wrap">
        <div class="done-stars">${"⭐".repeat(s)}${"☆".repeat(3-s)}</div>
        <h2 style="font-size:28px">Hotovo!</h2>
        <p class="p-how">Dneska se povedlo <strong>${session.stars} z ${session.items.length}</strong> kartiček. Zítra zase kousek.</p>
        <p class="p-how" style="color:var(--muted);font-size:14.5px">Až tahle úroveň půjde dítěti snadno — klidně za týden — přepněte se v seznamu Úrovně na další. Ťukněte na úroveň a objeví se tlačítko.</p>
        <div class="stat-grid" style="width:100%">
          <div class="stat"><div class="n">${S.stars}</div><div class="l">hvězdiček celkem</div></div>
          <div class="stat"><div class="n">${streak()}</div><div class="l">${streak() === 1 ? "den" : (streak() >= 2 && streak() <= 4 ? "dny" : "dní")} v řadě</div></div>
        </div>
      </div>
    </div>
    <div class="rate">
      <button class="yes" id="doneBtn">Zpátky na trénink</button>
      <div class="backline"><button id="backBtn">← Vrátit poslední kartičku</button></div>
    </div>`;
}

function ukazPotvrzeni(){
  const el = document.querySelector(".confirm");
  if(el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

/* ---------------------------- události --------------------------- */
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if(!b) return;
  tab = b.dataset.tab; resetState = ""; render();
});

view.addEventListener("click", e => {
  if(e.target.closest("#startBtn")) return startSession();
  if(e.target.closest("#resetBtn")){ resetState = "ask"; render(); ukazPotvrzeni(); return; }
  if(e.target.closest("#resetNo")){ resetState = ""; render(); return; }
  if(e.target.closest("#resetYes")){
    S = JSON.parse(JSON.stringify(DEFAULT_STATE));
    save();
    resetState = "done";
    render();
    ukazPotvrzeni();
    return;
  }
  if(e.target.closest("#resetOk")){ resetState = ""; render(); return; }
  const sw = e.target.closest("[data-switch]");
  if(sw){
    S.level = +sw.dataset.switch;
    save();
    render();
    document.querySelector(".level.now")?.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  const lvl = e.target.closest("[data-level]");
  if(lvl){
    const box = lvl.parentElement.querySelector(".level-about");
    if(box) box.classList.toggle("hidden");
  }
});
view.addEventListener("change", e => {
  if(e.target.id === "lvlSel"){ S.level = +e.target.value; save(); render(); }
});

P.addEventListener("click", e => {
  if(e.target.closest("#skipBtn")){ session.ratings[session.i] = 0; return advance(); }
  if(e.target.closest("#backBtn")) return back();
  if(e.target.closest("#closeBtn")) return endSession();
  if(e.target.closest("#doneBtn")) return endSession();
  if(e.target.closest("#speakBtn")) return speak(session.items[session.i].t);
  const r = e.target.closest("[data-rate]");
  if(r) rate(+r.dataset.rate);
});

render();
</script>

try{
  const bezpecne = location.protocol === "https:" || location.hostname === "localhost";
  if("serviceWorker" in navigator && window.top === window.self && bezpecne){
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
}catch(e){}
</script>
